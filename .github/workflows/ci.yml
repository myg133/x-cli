name: CI

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ──────────────────────────────────────────────
  # 测试 + 构建（所有平台）
  # ──────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/x-cli -> target
            crates/x-cli-core -> target
            crates/x-cli-runtime -> target
            crates/x-cli-emitter-md -> target
            crates/x-cli-emitter-mcp -> target

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Clippy
        # x-cli v0.1 阶段 clippy warning 不阻塞 merge（防止 onboarding 摩擦）
        # warning 留待后续 v0.2 修
        run: cargo clippy --workspace --all-targets -- -W warnings
        continue-on-error: true

      - name: 构建发布二进制
        run: cargo build --release --bin x

      - name: 上传二进制包
        uses: actions/upload-artifact@v4
        with:
          name: x-cli-${{ matrix.os == 'ubuntu-latest' && 'linux-x64' || matrix.os == 'windows-latest' && 'win32-x64' || 'darwin-arm64' }}
          path: target/release/x${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 发布到 npm（仅打 tag 时触发）
  # ──────────────────────────────────────────────
  publish-npm:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: 调试 OIDC 环境
        shell: bash
        run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "NPM_CONFIG_AUTH_TYPE: ${NPM_CONFIG_AUTH_TYPE:-<未设置>}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo 可用 || echo 不可用)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:-<未设置>}"
          echo "--- npm config list ---"
          npm config list
          echo "--- .npmrc 内容 ---"
          cat .npmrc 2>/dev/null || echo "(无 .npmrc)"

      - name: 收集三平台二进制 → 发布到 npm
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/x-cli-npm/package.json').version")
          echo "版本: $VERSION"

          mkdir -p packages/x-cli-npm/bin

          cp artifacts/x-cli-linux-x64/x packages/x-cli-npm/bin/x-linux-x64
          cp artifacts/x-cli-win32-x64/x.exe packages/x-cli-npm/bin/x-win32-x64.exe
          cp artifacts/x-cli-darwin-arm64/x packages/x-cli-npm/bin/x-darwin-arm64

          chmod +x packages/x-cli-npm/bin/x-*

          cd packages/x-cli-npm
          npm publish --access public

  # ──────────────────────────────────────────────
  # 创建 GitHub Release（仅打 tag 时触发）
  # ──────────────────────────────────────────────
  create-release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: 重命名二进制（防止同名覆盖）
        shell: bash
        run: |
          mkdir -p release-binaries
          cp release-artifacts/x-cli-linux-x64/x      release-binaries/x-cli-linux-x64
          cp release-artifacts/x-cli-win32-x64/x.exe   release-binaries/x-cli-win32-x64.exe
          cp release-artifacts/x-cli-darwin-arm64/x    release-binaries/x-cli-darwin-arm64
          ls -la release-binaries/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}

            从 `packages/x-cli-npm/package.json` 读取版本号自动构建。

            ### 安装方式

            ```bash
            npm install -g @myg133/x-cli
            ```

            或从下方下载对应平台的二进制文件。
          draft: false
          prerelease: false
          files: release-binaries/*