# x-cli 发布工作流
# 在 git tag v* 时触发：构建 3 平台二进制 → 发布 npm 平台子包 → 发布 npm 主包
# 版本号从 packages/x-cli-npm/package.json 读取（单一事实源）
#
# 使用前：
# 1. 在 GitHub 仓库设置 → Secrets and variables → Actions 添加 NPM_TOKEN
#    （npm token 需有 publish 权限，可在 npmjs.com 创建）
# 2. 确保 Cargo.toml workspace version 与 package.json version 一致再打 tag

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # 为每个平台构建二进制并发布对应 npm 平台子包
  build-and-publish:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
            binary_name: x.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
            binary_name: x
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
            binary_name: x
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: 构建发布二进制
        run: cargo build --release --target ${{ matrix.target }}

      - name: 准备平台包目录
        shell: bash
        run: |
          mkdir -p packages/x-cli-${{ matrix.platform }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} \
             packages/x-cli-${{ matrix.platform }}/bin/

      - name: 同步版本号（从主包读取）
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/x-cli-npm/package.json').version")
          echo "版本: $VERSION"
          node -e "
            const fs = require('fs');
            const pkgPath = './packages/x-cli-${{ matrix.platform }}/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'

      - name: 上传二进制到 workflow 产物
        uses: actions/upload-artifact@v4
        with:
          name: x-cli-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          if-no-files-found: error

      - name: 发布平台包到 npm
        working-directory: packages/x-cli-${{ matrix.platform }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 等待所有平台包发布成功后，发布主包
  publish-main-package:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'

      - name: 发布主包到 npm
        working-directory: packages/x-cli-npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 创建 GitHub Release，附上三平台二进制
  create-release:
    needs: publish-main-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}

            从 `packages/x-cli-npm/package.json` 读取版本号自动构建。

            ### 安装方式

            ```bash
            npm install -g @myg133/x-cli
            ```

            或从下方下载对应平台的二进制文件。
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/*